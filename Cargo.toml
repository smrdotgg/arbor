[package]
name = "satchel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A fast, small, cross-platform file manager"

[dependencies]
# anomalyco/rune, checked out into vendor/rune at the commit in RUNE_REV. Lean feature set: no audio, no SVG.
rune = { path = "vendor/rune/crates/rune", default-features = false, features = [
    "accessibility",
    "dbus",
    "embedded-fonts",
    "metal-backend",
] }

# The settings file. Parse only (no writer, no serde): already in the lock file through Rune's
# build dependencies, and it reports each error's position, which the status bar shows as a line.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

# Quick preview's image decoders, run on a worker only while the preview is open (src/preview/decode.rs).
# png and image (with png and jpeg) are already in the lock file through Rune. png streams rows,
# so a big PNG shrinks as it decodes. image adds only its built-in BMP codec, plus EXIF
# orientation parsing. jpeg-decoder, unlike zune-jpeg, can decode at 1/2, 1/4 or 1/8 size in
# the IDCT (a 12 MP photo for a 1000 px panel: half the time, 1/16 of the memory). gif and
# image-webp are the codecs image itself uses for those formats, without its encoders.
png = "0.18"
image = { version = "0.25", default-features = false, features = ["bmp"] }
jpeg-decoder = { version = "0.3", default-features = false }
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = { version = "0.2", default-features = false }

# Regular expressions for Batch Rename and Select by Pattern's `re:`. regex-lite, not regex: no
# Unicode tables and no DFA, so a fraction of the size, and file names are short, so its
# backtracking-free NFA matcher is fast enough (see BENCH.md). Classes like \w and case folding
# are ASCII only.
regex-lite = "0.1"

# Compress and Extract Here (src/archive/): deflate and the CRC for ZIP and gzip. Both are already
# in the lock file through png, with these features; Satchel's own ZIP and tar code is on top
# (no zip crate: DECISIONS.md, 2026-11-11).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = { version = "1", default-features = false, features = ["std"] }

# Trash: NSFileManager on macOS, the shell's Recycle Bin on Windows through IFileOperation (COM, hence
# Win32_System_Com), and Linux follows the XDG spec.
# windows-sys also lists the drive letters, and does no-replace moves and copies and reads file ids.
# No-replace renames and clones (renameat2, renamex_np, clonefile). Already in the lock file through Rune.
[dev-dependencies]
# Encoders for the preview's test images and the bench's photo (tests and examples only; the
# app's own build gets just the features above).
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
# Reading the accessibility tree Rune reports (`Runtime::accessibility_json`) in tests. Already
# in the lock file through Rune.
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# The wgpu Rune already builds, with Rune's features: for the type `rune::warm_gpu` takes on Linux
# (src/gpu.rs), and examples/gpu_probe.rs on Windows.
wgpu = { version = "30", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# org.freedesktop.FileManager1 on the session bus, served only while Satchel is the default for
# folders (src/incoming/linux.rs). The same zbus and Tokio Rune's `dbus` feature already builds, so no
# new crates: one current-thread runtime on the bus thread, told by a Tokio channel (`sync`, which
# zbus builds already) when Make or Restore changes whether it should serve.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
# Quick preview's rich previews (PDF, video, office documents, fonts, HEIC…): Quick Look's
# QLThumbnailGenerator, and CoreGraphics to turn its CGImage into RGBA (src/thumb.rs). Only the
# generator, its request and its result; objc2, block2 and objc2-core-graphics are already in the
# lock file through Rune.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "QLThumbnailGenerationRequest",
    "QLThumbnailGenerator",
    "QLThumbnailRepresentation",
] }

[target.'cfg(windows)'.dependencies]
# Win32_Graphics_Gdi: reading the shell thumbnail's bitmap (src/thumb.rs). Win32_System_Registry:
# the Recycle Bin's settings, checked before a trash (src/trash/win.rs). Pipes, IO, Security,
# RemoteDesktop (the session id) and WindowsAndMessaging (AllowSetForegroundWindow): one Satchel
# per session, a second handing its folders to the first (src/incoming/windows.rs). Ioctl,
# LibraryLoader and Diagnostics_Debug: ejecting a drive and hearing drives come and go
# (src/volumes.rs).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Rune builds these crates as published plus a patch of its own (vendor/rune/vendor/*.patch; Rune's
# Cargo.toml and AGENTS.md, "Layout"), and a dependency's [patch] doesn't apply to the workspace
# that uses it, so Satchel patches them too, from the same Rune checkout (RUNE_REV; CI clones it
# into vendor/rune). Without them Satchel builds with the published crates and loses what the patches do:
# wgpu-hal: on Windows the window's adapter picked from DXGI's list with no D3D12 device made on the
# others, and FXC loaded only on a first compile; winit: no TaskbarList COM call when a window is
# made; parley_engine: UAX #9 L1 and cheaper shaping; accesskit_windows: headings and landmarks.
[patch.crates-io]
accesskit_windows = { path = "vendor/rune/vendor/accesskit_windows" }
parley_engine = { path = "vendor/rune/vendor/parley_engine" }
wgpu-hal = { path = "vendor/rune/vendor/wgpu-hal" }
winit = { path = "vendor/rune/vendor/winit" }

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 16
incremental = true

# Shipping build: slower to compile, smaller and a bit faster.
[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = "thin"
strip = true
