name: Cold start (Windows)

# The cold-start probes (`examples/win32_hello.rs`, `examples/rune_hello.rs`, and Arbor with
# ARBOR_TIMING_FILE) built from the `dist` profile on a Windows runner, zipped as
# coldstart-probes-windows.zip, measured here with the script the owner runs
# (scripts/coldstart-probe.ps1), and published once as the pre-release `coldstart-probe-1`.
# The runner has no real GPU (WARP or a basic display adapter), so its GPU numbers aren't a
# laptop's; its CPU-side numbers are.

on:
  push:
    branches: ['perf/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  probes:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Rune and use crates.io
        run: |
          git init -q vendor/rune
          git -C vendor/rune fetch -q --depth 1 https://github.com/anomalyco/rune "$(cat RUNE_REV)"
          git -C vendor/rune checkout -q FETCH_HEAD
          rm .cargo/config.toml

      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: coldstart-${{ hashFiles('RUNE_REV') }}

      - name: Build the probes (dist profile)
        run: cargo build --profile dist --locked --bin arbor --example rune_hello --example win32_hello

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory probes | Out-Null
          Copy-Item target/dist/arbor.exe probes/arbor.exe
          Copy-Item target/dist/examples/rune_hello.exe probes/rune-hello.exe
          Copy-Item target/dist/examples/win32_hello.exe probes/win32-hello.exe
          Get-ChildItem probes | Format-Table Name, Length
          Compress-Archive -Path probes/*.exe -DestinationPath coldstart-probes-windows.zip
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, AdapterRAM
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors

      - uses: actions/upload-artifact@v4
        with:
          name: coldstart-probes-windows
          path: coldstart-probes-windows.zip
          if-no-files-found: error

      # The owner's script on the zip just built: Windows PowerShell 5.1, then PowerShell 7.
      - name: Measure (Windows PowerShell 5.1)
        shell: powershell
        env:
          ARBOR_PROBE_RUNS: '10'
        run: |
          $env:ARBOR_PROBE_ZIP = (Resolve-Path coldstart-probes-windows.zip).Path
          ./scripts/coldstart-probe.ps1

      - name: Measure (PowerShell 7)
        shell: pwsh
        run: |
          $env:ARBOR_PROBE_ZIP = (Resolve-Path coldstart-probes-windows.zip).Path
          ./scripts/coldstart-probe.ps1

      # Which adapter and backend Rune picked, from its own log (stderr, redirected: a windows-
      # subsystem exe still writes to an inherited handle).
      - name: Rune's GPU log
        shell: pwsh
        run: |
          $env:RUNE_GPU_LOG = '1'; $env:ARBOR_TIMING = '1'; $env:ARBOR_EXIT_AFTER_FIRST_FRAME = '1'
          foreach ($i in 1..3) {
            $p = Start-Process probes/arbor.exe -WorkingDirectory $HOME -PassThru -RedirectStandardError "err$i.txt"
            if (-not $p.WaitForExit(30000)) { $p.Kill() }
            Get-Content "err$i.txt"
          }

      # Published once: a later push doesn't replace what the owner may have downloaded.
      - name: Publish the pre-release (once)
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/perf/fast-start'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view coldstart-probe-1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "coldstart-probe-1 exists; left as it is"
          else
            gh release create coldstart-probe-1 coldstart-probes-windows.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Cold-start probes 1" \
              --notes "Three exes for timing cold start on Windows (process creation to first frame): win32-hello (bare Win32 + GDI), rune-hello (one Rune text view, Arbor's features and dist profile), arbor (with ARBOR_TIMING_FILE). Not a release of Arbor. Run in PowerShell: irm https://raw.githubusercontent.com/smrdotgg/arbor/coldstart-probe-1/scripts/coldstart-probe.ps1 | iex"
          fi

      - name: The owner's one-liner, from the release (Windows PowerShell 5.1)
        if: steps.publish.outcome == 'success'
        shell: powershell
        run: irm https://raw.githubusercontent.com/smrdotgg/arbor/coldstart-probe-1/scripts/coldstart-probe.ps1 | iex
