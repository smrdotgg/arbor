name: Cold start (Windows)

# Cold-start probes built from the `dist` profile on a Windows runner and measured there:
# this commit's Satchel (SATCHEL_TIMING_FILE), the main branch's satchel.exe (the latest successful
# CI run's Windows package) as the baseline, rune-hello (one text view; as rune-hello-warm.exe
# it also calls `rune::warm_gpu` first), win32-hello (bare Win32 + GDI) and gpu_probe (Rune's GPU
# path phase by phase). All zipped as the artifact coldstart-probes-3-windows, which runs as-is
# on another machine (scripts/coldstart-ab.ps1). Earlier rounds (`coldstart-probe-1`,
# `coldstart-probe-2`) are kept at their tags. The runner has no real GPU (WARP), so its GPU
# numbers aren't a laptop's; its CPU-side numbers are.

on:
  push:
    branches: ['perf/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  actions: read

jobs:
  probes:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Files exactly as committed, LF line endings on Windows too. Rune's precompiled DXBC uber
      # shader once needed it (a CRLF checkout made every launch compile it with FXC, BENCH.md
      # 2026-11-12); Rune now reads its WGSL's CRLF as LF and has a .gitattributes, and this
      # keeps both checkouts byte-identical to their commits anyway.
      - name: Check out without converting line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Fetch Rune and use crates.io
        run: |
          git init -q vendor/rune
          git -C vendor/rune fetch -q --depth 1 https://github.com/anomalyco/rune "$(cat RUNE_REV)"
          git -C vendor/rune checkout -q FETCH_HEAD
          rm .cargo/config.toml

      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: coldstart-${{ hashFiles('RUNE_REV') }}

      - name: Build the probes (dist profile)
        run: cargo build --profile dist --locked --bin satchel --example rune_hello --example win32_hello --example gpu_probe

      # The baseline: satchel.exe from main's latest successful CI run (its Windows package).
      - name: Main's satchel.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId,headSha -q '.[0] | "\(.databaseId) \(.headSha)"')
          echo "main: run ${run% *}, commit ${run#* }"
          gh run download "${run% *}" --repo "$GITHUB_REPOSITORY" -n satchel-Windows -D main-pkg
          mkdir -p main && unzip -q -o main-pkg/*.zip -d main && find main -name satchel.exe

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory probes | Out-Null
          Copy-Item target/dist/satchel.exe probes/satchel.exe
          Copy-Item (Get-ChildItem main -Recurse -Filter satchel.exe | Select-Object -First 1).FullName probes/satchel-main.exe
          Copy-Item target/dist/examples/rune_hello.exe probes/rune-hello.exe
          Copy-Item target/dist/examples/rune_hello.exe probes/rune-hello-warm.exe
          Copy-Item target/dist/examples/win32_hello.exe probes/win32-hello.exe
          Copy-Item target/dist/examples/gpu_probe.exe probes/gpu_probe.exe
          Copy-Item scripts/coldstart-ab.ps1 probes/coldstart-ab.ps1
          Get-ChildItem probes | Format-Table Name, Length
          Compress-Archive -Path probes/* -DestinationPath coldstart-probes-3-windows.zip
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, AdapterRAM
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors

      - uses: actions/upload-artifact@v4
        with:
          name: coldstart-probes-3-windows
          path: coldstart-probes-3-windows.zip
          if-no-files-found: error

      # Process creation to first frame, alternating, after one untimed launch each.
      - name: A/B, main against this commit
        continue-on-error: true
        shell: pwsh
        run: ./scripts/coldstart-ab.ps1 -Runs 15 probes/satchel-main.exe probes/satchel.exe

      # Whether making the GPU beside Rune's CPU-drawn first frame slows that frame (what Satchel
      # did on Windows with `warm_gpu` before this commit).
      - name: A/B, rune-hello without and with warm_gpu
        continue-on-error: true
        shell: pwsh
        run: ./scripts/coldstart-ab.ps1 -Runs 15 probes/rune-hello.exe probes/rune-hello-warm.exe probes/win32-hello.exe

      # What happens after the first frame: Satchel kept open 3 s, then its launch marks (the
      # window shown, the first frame's renderer, the GPU made and taking over).
      - name: Hand-over to the GPU
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'handover.txt'
          $env:SATCHEL_TIMING_FILE = $log
          $env:SATCHEL_EXIT_AFTER_MS = '3000'
          foreach ($i in 1..5) {
            $p = Start-Process -FilePath probes/satchel.exe -WorkingDirectory $HOME -PassThru
            if (-not $p.WaitForExit(30000)) { try { $p.Kill() } catch { } }
            Start-Sleep -Milliseconds 300
          }
          Get-Content $log | Where-Object { $_ -like 'satchel-timing first-frame*' -or $_ -like 'satchel-timing launch-marks*' -or $_ -match '^satchel ' }

      # Rune's GPU path, then the same with the DX12 adapters listed through wgpu first and held
      # (Satchel's workaround before this commit), alternating, three times each.
      - name: gpu_probe rune vs rune-held
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($i in 1..3) { foreach ($m in 'rune', 'rune-held') { Write-Host "== $m"; & probes/gpu_probe.exe $m } }
