name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Files exactly as committed, LF line endings on Windows too: Rune loads its precompiled
      # DXBC uber shader only when the WGSL it embeds hashes as committed. With the Windows
      # runner's default (core.autocrlf true) every launch compiled it with FXC instead
      # (BENCH.md, 2026-11-12); build.rs now refuses such a checkout.
      - name: Check out without converting line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      # Rune at the commit pinned in RUNE_REV, crates from crates.io. Locally, .cargo/config.toml
      # builds offline from vendor/crates; CI has no vendor/crates, so drop it here.
      - name: Fetch Rune and use crates.io
        run: |
          git init -q vendor/rune
          git -C vendor/rune fetch -q --depth 1 https://github.com/anomalyco/rune "$(cat RUNE_REV)"
          git -C vendor/rune checkout -q FETCH_HEAD
          rm .cargo/config.toml

      # The runner's apt mirror (azure.archive.ubuntu.com) sometimes can't be resolved: three
      # tries, then the same packages from archive.ubuntu.com (the runner's sources name it
      # through apt-mirrors.txt; plain images, through either sources format).
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          get() { sudo apt-get update -q && sudo apt-get install -yq libxkbcommon-dev libwayland-dev; }
          for try in 1 2 3; do get && exit 0; sleep 15; done
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$f"; fi
          done
          get

      # What the runner's registry says about its Recycle Bins (src/trash/win.rs reads it before a trash).
      - name: Recycle Bin settings
        if: runner.os == 'Windows'
        run: reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\BitBucket' //s || true

      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: rune-${{ hashFiles('RUNE_REV') }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # The selection's model tests, 5,000 cases each from the same fixed seeds (`prop.rs`
      # derives them from the test's name), beyond the few dozen every run has.
      - name: Selection model, 5,000 cases
        if: runner.os == 'Linux'
        run: ARBOR_PROP_CASES=5000 cargo test --release --locked -- selection_matches_a_model

      # The cold-start scripts put back the caller's timing variables (scripts/coldstart-ab.ps1,
      # scripts/coldstart-probe-2.ps1), checked with stand-in exes.
      - name: Cold-start scripts keep the caller's environment
        shell: pwsh
        run: ./scripts/test-coldstart-env.ps1

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      # The Mac package is universal (scripts/package.sh): the Intel slice needs its target.
      - name: Intel target (macOS)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      # The installable package for this platform (scripts/package.sh), from the stripped `dist`
      # build: Arbor.app and its zip on macOS, the tarball on Linux, the zip on Windows. Every
      # run uploads it; a v* tag also publishes it as a GitHub Release (the release job).
      - name: Package
        run: scripts/package.sh

      - name: Check the package (Linux)
        if: runner.os == 'Linux'
        run: |
          t=$(mktemp -d) && tar -C "$t" -xzf dist/arbor-*-linux-*.tar.gz
          env -i HOME="$t/home" PATH=/usr/bin:/bin sh "$t"/arbor-*/install.sh
          test -x "$t/home/.local/bin/arbor"
          grep -q "^Exec=$t/home/.local/bin/arbor %F$" "$t/home/.local/share/applications/arbor.desktop"
          grep -q "^MimeType=inode/directory;$" "$t/home/.local/share/applications/arbor.desktop"
          test -f "$t/home/.local/share/icons/hicolor/256x256/apps/arbor.png"
          # Runs, without a window: nothing to restore in a fresh home.
          env -i HOME="$t/home" PATH=/usr/bin:/bin "$t/home/.local/bin/arbor" --restore-folder-default
          env -i HOME="$t/home" PATH=/usr/bin:/bin sh "$t"/arbor-*/uninstall.sh
          test ! -e "$t/home/.local/bin/arbor"

      - name: Check the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Item target/dist/arbor.exe).VersionInfo
          $v | Format-List ProductName, FileDescription, FileVersion, ProductVersion, OriginalFilename
          if ($v.ProductName -ne 'Arbor' -or -not $v.FileVersion) { throw 'arbor.exe has no version information' }

      - name: Check the package (macOS)
        if: runner.os == 'macOS'
        run: |
          plutil -p dist/Arbor.app/Contents/Info.plist
          codesign -dv dist/Arbor.app 2>&1 | grep -E "Identifier|Signature"
          sips -g pixelWidth -g pixelHeight dist/Arbor.app/Contents/Resources/Arbor.icns
          bin=dist/Arbor.app/Contents/MacOS/arbor
          # Both slices, each built for the Info.plist's LSMinimumSystemVersion.
          lipo -archs "$bin" && lipo "$bin" -verify_arch arm64 x86_64
          min=$(plutil -extract LSMinimumSystemVersion raw dist/Arbor.app/Contents/Info.plist)
          for a in arm64 x86_64; do
            vtool -arch "$a" -show-build "$bin" | tee /dev/stderr | grep -Eq "minos $min$"
          done
          test "$("$bin" --version)" = "arbor $(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          # The Intel slice, run under Rosetta (installed first if the runner lacks it).
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license || true
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$bin" --version
          else
            echo "::warning::No Rosetta on this runner: the Intel slice was built and checked, not run"
          fi
          ls dist/Arbor-*-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: arbor-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # A v* tag: the three packages become a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arbor-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # A tag with a suffix (v0.1.0-alpha.1) is published as a pre-release.
          pre=(); [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Arbor ${GITHUB_REF_NAME#v}" --generate-notes "${pre[@]}"

      # Numbers for the owner's decision on full Windows thumbnail generation, which can't be
      # cancelled (src/thumb.rs, UNCANCELLABLE_WINDOWS_THUMBNAILS): how long the shell takes for
      # a PDF and for videos, cache-only and full. A measurement, not a check.
      - name: OS thumbnail timings
        if: runner.os != 'Linux'
        continue-on-error: true
        run: |
          dir="$RUNNER_TEMP/thumbs" && mkdir -p "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            command -v ffmpeg || choco install ffmpeg -y --no-progress >/dev/null || true
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          fi
          if command -v ffmpeg; then
            ffmpeg -loglevel error -f lavfi -i testsrc2=duration=10:size=1920x1080:rate=30 -c:v libx264 -pix_fmt yuv420p "$dir/video-1080p-10s.mp4"
            ffmpeg -loglevel error -f lavfi -i testsrc2=duration=120:size=3840x2160:rate=30 -c:v libx264 -preset ultrafast -pix_fmt yuv420p "$dir/video-4k-120s.mp4"
            ffmpeg -loglevel error -f lavfi -i testsrc2=duration=10:size=1920x1080:rate=30 -c:v libvpx-vp9 -deadline realtime "$dir/video-1080p-10s.webm"
          fi
          ls -l "$dir"
          ARBOR_THUMB_DIR="$dir" cargo test --release --locked -- --ignored --nocapture os_thumbnail_speed
